name: Full A-to-Z Portfolio Backup Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: full-portfolio-backup-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup repository
        uses: actions/checkout@v4
        with:
          path: backup
          fetch-depth: 0

      - name: Checkout complete source portfolio
        uses: actions/checkout@v4
        with:
          repository: bishnu7798/bishnu-portfolio
          ref: main
          path: source
          fetch-depth: 0

      - name: Copy every non-workflow source file into backup
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/workflows/' \
            source/ backup/

      - name: Commit and push backup
        run: |
          cd backup
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Backup already matches source files."
          else
            git commit -m "Full A-to-Z backup sync from bishnu-portfolio"
            git push origin HEAD:main
          fi
