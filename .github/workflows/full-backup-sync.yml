name: Full portfolio backup sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy source repository
        run: |
          rm -rf /tmp/source
          git clone --depth 1 https://github.com/bishnu7798/bishnu-portfolio.git /tmp/source
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a /tmp/source/. .

      - name: Commit full backup
        run: |
          git init
          git checkout -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Full backup of bishnu-portfolio"
          git remote add origin "https://x-access-token:$" + "{"+ "{ secrets.GITHUB_TOKEN }" + "}" + "@github.com/$" + "{ github.repository }.git"
          git push --force origin main
