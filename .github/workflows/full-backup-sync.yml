name: Full portfolio backup sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy source repository
        run: |
          rm -rf /tmp/source
          git clone --depth 1 https://github.com/bishnu7798/bishnu-portfolio.git /tmp/source
          rm -rf /tmp/source/.git
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/source/. .

      - name: Commit full backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Full backup of bishnu-portfolio" || exit 0
          git push origin HEAD:main --force
